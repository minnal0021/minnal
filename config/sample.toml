# minnal_db_api.toml — sample configuration
#
# This file is a superset of minnal.toml.  Every field has a built-in default,
# so you only need to specify the values you want to override.
#
# Start the server with:
#   minnal_db_api /path/to/this/file.toml
#   MINNAL_CONFIG_FILE=/path/to/this/file.toml minnal_db_api
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# [storage] — file-system paths
# ---------------------------------------------------------------------------
[storage]

# Directory where the minnal_db data files are written.
db_path = "./data/db"

# Directory where per-store JSON schema files are persisted.
# One file per namespace, e.g. schemas/users.json.
schema_dir = "./data/schemas"

# Directory where rolling log files are written.
log_dir = "./data/log"

# ---------------------------------------------------------------------------
# [logging] — log verbosity
# ---------------------------------------------------------------------------
[logging]

# Minimum log level when RUST_LOG is not set in the environment.
# RUST_LOG always takes precedence over this setting.
# Accepted values: "error", "warn", "info", "debug", "trace"
level = "info"

# ---------------------------------------------------------------------------
# [api] — HTTP server settings
# ---------------------------------------------------------------------------
[api]

# Address and port the REST API binds to.
# Use "127.0.0.1:8080" to restrict to localhost only.
listen_addr = "0.0.0.0:8080"

# ---------------------------------------------------------------------------
# [memtable] — in-memory write buffer
# ---------------------------------------------------------------------------
[memtable]

# Maximum number of entries (including tombstones) the skip-list memtable
# will hold before flushing to disk.
max_capacity = 100_000

# ---------------------------------------------------------------------------
# [sharding] — value-log and LSM sharding
# ---------------------------------------------------------------------------
[sharding]

# Number of independent shards for the value log and LSM tree.
# Higher values reduce lock contention under concurrent write workloads.
# Must be a power of two; changing this after data exists is not supported.
num_buckets = 8

# ---------------------------------------------------------------------------
# [lsm] — LSM-tree compaction
# ---------------------------------------------------------------------------
[lsm]

# Trigger a compaction when the memtable reaches this percentage of
# max_capacity (0–100).  Lower values compact more aggressively at the cost
# of more frequent background I/O.
compaction_threshold_percent = 95

# ---------------------------------------------------------------------------
# [sync] — write-path durability vs. throughput trade-off
# ---------------------------------------------------------------------------
[sync]

# How many put/delete operations to batch before flushing the value log
# and marking WAL entries as persisted.
#
#   1     → flush on every write  (maximum durability, lowest throughput)
#   1000  → flush every 1 000 writes (good balance — the default)
#   0     → only flush on close or GC (maximum throughput, least durability)
#
# The WAL itself is fsynced after every append regardless of this setting,
# so crash recovery is always possible.
records_per_sync = 1_000

# ---------------------------------------------------------------------------
# [thresholds] — GC trigger thresholds
# ---------------------------------------------------------------------------
[thresholds]

# Start a value-log GC cycle when the percentage of wasted space (dead records)
# in any shard exceeds this value (0.0–100.0).  This is the TRIGGER: it decides
# whether a namespace is worth collecting at all.
value_log_waste_threshold = 30.0

# Once a GC cycle is running, rewrite an individual sealed value-log SEGMENT when
# at least this percentage of it is garbage (0.0–100.0).  This is the SELECTION
# rule, and it is a different question from the trigger above.
#
# Keep it well BELOW value_log_waste_threshold.  A segment under this threshold is
# treated as clean and left in place — its live records keep their pointers and its
# garbage rides along, unreclaimed.  If the two values were equal, garbage that sits
# just under the trigger could never be collected: every pass would skip those
# segments, report success, and leave the shard still over its trigger, so GC would
# run again and do exactly the same thing.  A lower threshold rewrites more segments
# (and their survivors) per pass but actually finishes the job.  Default: 10.0.
segment_gc_threshold = 10.0

# Garbage share (0.0–100.0) of a bucket's ACTIVE TAIL segment at which GC seals it
# so it can be collected. A small or idle store keeps all its data in one tail
# segment per bucket that never fills — so tail-sealing is its only path to
# collection. Sealing costs a one-time rewrite of the tail's live remainder: at G%
# garbage it rewrites (100-G)% to free G%, so 50 is the breakeven.
#
# Leave this UNSET to track value_log_waste_threshold — the same bar that decides a
# bucket is worth collecting also seals its tail, so garbage never strands between
# the two. Set it (e.g. 50.0) to pin the bar higher and favour write-amplification
# over reclaimed space.
# tail_gc_min_garbage_pct = 50.0

# Memory limits for field-index write buffers. A field-index update changes an
# in-memory copy of the affected bitmap container; the copies are written to
# the index files (a "spill") once per index checkpoint. These limits cap the memory all
# field indexes of the database hold in those copies together (they are not
# per field).
#   soft: crossing it requests an index checkpoint now, which writes every
#         buffer out.
#   hard: a write that leaves the total above it writes its own field's buffer
#         out before returning, so memory stays bounded even if checkpoints
#         fall behind. A soft limit above the hard one is clamped to it.
# Sizing: the buffers hold what changed within one checkpoint interval
# (1.75 s), so they grow with the write rate and the number of indexed fields.
# Four indexed fields at the server's top rate (about 5,000 no-WAL writes/s,
# random updates) peak at about 8.5 MB; WAL-backed writes (about 400/s) at
# under 5 MB. A limit set too low costs throughput, not correctness: at 2/4 MiB
# the constant early checkpoints halved the update rate. Check
# `index_overlay.peak_bytes` in GET /admin/storage/ops-metrics against the soft
# limit when adding many indexed fields.
# Defaults: 33554432 (32 MiB) soft, 67108864 (64 MiB) hard.
index_overlay_soft_bytes = 33_554_432
index_overlay_hard_bytes = 67_108_864

# Compact a field-index bitmap store at checkpoint when this percentage of its
# value region is dead space (0.0–100.0). The bitmap store is append-only: each
# spill appends every changed bitmap container plus a new directory for its
# bitmap, and leaves the previous copies behind; compaction reclaims them. Lower = reclaim sooner (more compaction work),
# higher = let more dead space accumulate first. Default 50.
index_blob_waste_threshold = 50.0

# Backpressure: when a single field index accumulates this many reclaimable dead
# blob bytes, the write path requests an index checkpoint (which compacts the
# field) immediately instead of waiting for the next periodic tick. Dead space
# grows per spill, so this matters only when the write buffers stay over their
# hard limit and spill on most writes. It is an absolute BYTE cap, not a ratio:
# a field whose few bitmaps change on every spill crosses any waste ratio after
# a few spills and stays near 100%, so a ratio trigger would fire on nearly
# every write. Self-debounces — compaction resets the field's dead-byte count. 0
# disables it on the write path (WAL replay at open still compacts on the
# default cap). Default: 67108864 (64 MiB).
index_blob_backpressure_bytes = 67_108_864

# Cap on how many fully-persisted WAL segments the INDEX-REPLAY WATERMARK may
# hold back from WAL GC.
#
# WAL GC will not reclaim a segment an active field index still needs to replay
# after a crash — without that gate the index silently loses those documents for
# the life of the database. The pin normally drains in seconds: GC asks the index
# checkpoint worker for an early checkpoint and defers a tick, so WAL retention
# tracks checkpoint latency rather than the timer.
#
# If the checkpoint worker is disabled or wedged, nothing advances the watermark
# and the WAL would grow without bound, so past this many pinned segments GC
# reclaims the oldest of them anyway. That KNOWINGLY leaves the affected field
# indices incomplete — an ERROR is logged when it happens. Raise this if you would
# rather spend disk than lose index coverage; set 0 to disable the backstop
# entirely (unbounded pinned WAL — only for callers certain their checkpoint
# worker is healthy). Default: 32.
max_pinned_wal_segments = 32

# ---------------------------------------------------------------------------
# [scheduled_tasks] — background worker intervals
# ---------------------------------------------------------------------------
[scheduled_tasks]

# How often (seconds) the value-log garbage collector runs.
value_log_gc_interval_secs = 60

# How often (seconds) the WAL garbage collector runs.
wal_gc_interval_secs = 60

# How often (seconds) the LSM compaction worker checks for pending work.
lsm_compaction_interval_secs = 60

# How often (seconds) the TTL expiry worker scans for expired keys.
ttl_cleanup_interval_secs = 3_600

# How often the index checkpoint worker runs, in MILLISECONDS.
#
# This is the crash-replay window. After a crash every field index replays the
# WAL from its last checkpoint, so a long interval means a crash faces that much
# work before the database serves again. It also caps WAL retention: the
# index-replay watermark refuses to let WAL GC reclaim a segment a field still
# needs, so retention tracks this interval (see thresholds.max_pinned_wal_segments).
#
# The per-tick cost is a flush of each field index plus one marker write
# (tmp + rename + two fsyncs) per field — small beside the WAL's fsync on every
# write. Milliseconds, not seconds, because the useful range is sub-second to a
# few seconds. Default: 1750.
index_checkpoint_interval_ms = 1750

# ---------------------------------------------------------------------------
# [wal] — Write-Ahead Log
# ---------------------------------------------------------------------------
[wal]

# Maximum size of a single WAL segment file in bytes before a new segment
# is created.  Default: 64 MiB.
#
# Fixed at creation: a WAL segment id is offset / segment_size, so this cannot
# change once the WAL holds data (it would map stored offsets to the wrong
# segment files). It is applied only to a brand-new WAL and then recorded in a
# `wal_segment_size` marker; on an existing WAL the recorded size wins and a
# differing value here is ignored with a warning.
segment_size_bytes = 67_108_864   # 64 MiB

# ---------------------------------------------------------------------------
# [value_log] — value-log segment files
# ---------------------------------------------------------------------------
[value_log]

# Size at which a value-log segment file is sealed and a new one opened.
# Default: 256 MiB.  Must be a multiple of 4096, at least 64 KiB, and at most
# 4 GiB (a record's offset within its segment is stored as a u32).
#
# Larger segments mean fewer files (and fewer open file descriptors) but coarser
# GC: a segment is the unit GC reclaims, so its size bounds how much survivor
# data a single pass may have to rewrite.
#
# Unlike sharding.num_buckets, this is NOT fixed at creation: a segment's size is
# not encoded in any value pointer, so existing segments keep the size they were
# written at and new ones simply use whatever is configured now.
segment_size_bytes = 268_435_456   # 256 MiB

# Re-verify each value's CRC32 checksum on every read.
# Values always carry a CRC on disk; this controls whether reads re-check it.
# Enabling catches silent corruption before a value is served, but adds a full
# CRC pass over the value to the read hot path (measurable for large values).
# SSTable-level checksums are always verified regardless of this setting.
# Default: false (latency first).
verify_checksums_on_read = false

# ---------------------------------------------------------------------------
# [vector_index] — async vector-index background worker settings
# ---------------------------------------------------------------------------
[vector_index]

# Seconds to sleep after a pass that contained at least one embedding failure,
# before re-scanning the queue.  Lower values retry faster; higher values give
# the embedding service more time to recover.  Default: 2.
retry_wait_secs = 5

# Maximum number of embedding attempts per queue entry.  Once an entry reaches
# this limit it is skipped on every subsequent pass and left in the queue for
# inspection and manual removal via:
#   DELETE /admin/vector-queue/namespace/{ns}/doc/{doc_id_hex}
# Default: 5.
max_retries = 5

# Maximum number of concurrent embedding calls the worker keeps in flight at
# once.  Entries from different namespaces are interleaved (round-robin) before
# being fed into this concurrency pool, so no single namespace starves others.
# Default: 4.
concurrency = 4

# ---------------------------------------------------------------------------
# [semantic_search] — the embedding service and the cluster centroids
#
# A store's embedding model, dimension, chunking, code widths and search
# defaults are NOT set here: they live in the store's schema (`vector_index`),
# with built-in defaults (gemma, 768 dimensions, 4-sentence windows sliding by
# 2, n_probes 64, first-pass cut 1000, top_k 100). Leaving one of those keys
# here is a startup error.
# ---------------------------------------------------------------------------
[semantic_search]

# Base URL of the embedding service.
# Requests are sent to {url}/embedding/{model}/document and {url}/embedding/{model}/query
# (where {model} is the store's embedding_model) as a batch POST:
# body {"payloads": [str, ...], "dimensions": N} -> {"embeddings": [[f32], ...]}.
# Chunking/tokenisation happens in minnal, not the service.
# Default: http://localhost:8001
embedding_service_url = "http://localhost:8001"

# Directory of IVF cluster centroids, one set per model at
# {centroid_dir}/{model}/clusters.json. A store uses the set for its model.
# Relative paths resolve against the working directory; release.sh and the
# Docker image rewrite this line to where they stage the centroids.
# Default: service/embedding_support
centroid_dir = "service/embedding_support"

# Time-to-live (seconds) for cached query embeddings in the system-wide
# `system_qemb_cache` namespace. After this duration a cached entry is evicted by
# the TTL worker. Entries are keyed by model, dimension and query text, so
# neither a store's model nor its chunking settings invalidate them; clear the cache
# (DELETE /admin/indices/vector/query-cache) if the service starts producing
# different vectors under the same model name, rather than waiting for this to expire.
# Default: 86400 (1 day).
# query_embedding_cache_ttl_secs = 86400

# Overall timeout (seconds) for a single embedding-service HTTP request
# (connect + send + receive). Caps how long an indexing or search call can block
# on a slow or hanging embedding service. Default: 30.
# embedding_request_timeout_secs = 30

# Timeout (seconds) for just the TCP connect phase to the embedding service.
# Fails fast when the host is unreachable. Should be shorter than
# embedding_request_timeout_secs (the overall cap). Default: 10.
# embedding_connect_timeout_secs = 10

# ---------------------------------------------------------------------------
# [[semantic_search.supported_models]] — enabled embedding models
#
# Each entry declares one embedding model this instance may serve.  The model
# set is data-driven: any name is accepted.  At startup the server validates
# that the cluster file for every listed model exists at
#   {centroid_dir}/{name}/clusters.json
# and that its centroids match the declared dimension, and loads only these
# models.  Without any entry, every {centroid_dir}/*/clusters.json is loaded.
# To add a model, drop its clusters.json under centroid_dir and add an entry
# here — no code change needed.
#
# Fields:
#   name      — model identifier (case-insensitive; lower-cased to form the
#               cluster-file sub-directory).  It is also the model key the
#               embedding service is asked for, so use a name the service serves.
#   dimension — embedding dimensionality the model produces (u16).
# ---------------------------------------------------------------------------

[[semantic_search.supported_models]]
name = "gemma"
dimension = 768

[[semantic_search.supported_models]]
name = "qwen"
dimension = 768
