# Cap `cargo test` at 5 concurrent test threads by default, but 1 on macOS.
#
# Each namespace eagerly opens `2 x num_buckets` file descriptors (one LSM L1
# file plus one value-log file per bucket), held for the namespace's lifetime.
# The libtest harness runs one test per core, so on a many-core machine the
# aggregate fd demand across concurrent tests scales with cores x namespaces and
# can exceed the OS soft limit ("Too many open files", os error 24). This bites
# hardest on macOS, whose default soft limit is 256 (vs 1024+ on typical Linux),
# so macOS stays serial while other hosts get some parallelism.
#
# `RUST_TEST_THREADS` is read by the libtest harness; setting it here applies to
# a bare `cargo test` on any machine without anyone needing to remember a flag.
# It is NOT `force`d, so a user can still dial parallelism up or down for a run,
# e.g. `RUST_TEST_THREADS=8 cargo test` or `RUST_TEST_THREADS=1 cargo test`.
[env]
RUST_TEST_THREADS = "5"

# Cargo's `[env]` table is global -- it has no per-platform form -- so the macOS
# override rides on the target runner instead: cargo executes each test binary
# as `/usr/bin/env RUST_TEST_THREADS=1 <binary>`, and that exec-time assignment
# wins over the `[env]` value above. The runner is cfg-gated, so it is inert on
# every non-macOS host. It also wraps `cargo run`/`cargo bench` binaries there,
# which is harmless -- nothing outside the libtest harness reads this variable.
#
# Note this override is NOT reachable from the command line the way `[env]` is:
# a macOS user wanting parallelism must pass `--config` or edit this file, e.g.
#   cargo test --config 'target."cfg(target_os = \"macos\")".runner=[]'
[target.'cfg(target_os = "macos")']
runner = ["/usr/bin/env", "RUST_TEST_THREADS=1"]
