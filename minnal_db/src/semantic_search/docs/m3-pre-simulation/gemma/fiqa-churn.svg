<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 451" width="720" height="451" role="img" aria-label="fiqa: recall gap to a fresh static fit before and after four churn scenarios"><desc>fiqa: recall gap to a fresh static fit before and after four churn scenarios</desc><style>text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif}.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.grid{stroke:#e4e3df}.ring{stroke:#fcfcfb}.ref{stroke:#8a8984}.reff{fill:#8a8984}.f0{fill:#2a78d6}.l0{stroke:#2a78d6}.f1{fill:#eb6834}.l1{stroke:#eb6834}.f2{fill:#1baf7a}.l2{stroke:#1baf7a}.f3{fill:#eda100}.l3{stroke:#eda100}.f4{fill:#e87ba4}.l4{stroke:#e87ba4}.f5{fill:#008300}.l5{stroke:#008300}.f6{fill:#4a3aa7}.l6{stroke:#4a3aa7}.f7{fill:#e34948}.l7{stroke:#e34948}.fr0{fill:#86b6ef}.lr0{stroke:#86b6ef}.fr1{fill:#3987e5}.lr1{stroke:#3987e5}.fr2{fill:#1c5cab}.lr2{stroke:#1c5cab}.fr3{fill:#0d366b}.lr3{stroke:#0d366b}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.grid{stroke:#383835}.ring{stroke:#1a1a19}.ref{stroke:#8f8e88}.reff{fill:#8f8e88}.f0{fill:#3987e5}.l0{stroke:#3987e5}.f1{fill:#d95926}.l1{stroke:#d95926}.f2{fill:#199e70}.l2{stroke:#199e70}.f3{fill:#c98500}.l3{stroke:#c98500}.f4{fill:#d55181}.l4{stroke:#d55181}.f5{fill:#008300}.l5{stroke:#008300}.f6{fill:#9085e9}.l6{stroke:#9085e9}.f7{fill:#e66767}.l7{stroke:#e66767}.fr0{fill:#184f95}.lr0{stroke:#184f95}.fr1{fill:#256abf}.lr1{stroke:#256abf}.fr2{fill:#5598e7}.lr2{stroke:#5598e7}.fr3{fill:#9ec5f4}.lr3{stroke:#9ec5f4}}</style><rect class="bg" x="0" y="0" width="720" height="451" rx="6"/><text class="ink" x="16.0" y="26.0" font-size="15" font-weight="600" text-anchor="start">FiQA (gemma): deletes and turnover leave C within about a point of a fresh fit</text><text class="ink2" x="16.0" y="45.0" font-size="12" font-weight="400" text-anchor="start">Recall@10 at 10% of entries read, minus static k-means fitted on the surviving chunks (points). C, target 128, k = 8.</text><line class="grid" x1="266.7" x2="266.7" y1="64" y2="320" stroke-width="1"/><text class="ink2" x="266.7" y="336.0" font-size="11" font-weight="400" text-anchor="middle">-4</text><line class="grid" x1="420.0" x2="420.0" y1="64" y2="320" stroke-width="1"/><text class="ink2" x="420.0" y="336.0" font-size="11" font-weight="400" text-anchor="middle">-2</text><line class="grid" x1="573.3" x2="573.3" y1="64" y2="320" stroke-width="1"/><text class="ink2" x="573.3" y="336.0" font-size="11" font-weight="400" text-anchor="middle">0</text><text class="ink2" x="420.0" y="356.0" font-size="12" font-weight="400" text-anchor="middle">difference from static k-means (recall points; 0 = as good)</text><rect class="fr1" x="524.0" y="71.0" width="49.3" height="16" rx="4.0"><title>delete a random half : -0.6</title></rect><text class="ink" x="518.0" y="83.0" font-size="11" font-weight="400" text-anchor="end">-0.6</text><rect class="fr3" x="498.7" y="91.0" width="74.7" height="16" rx="4.0"><title>delete a random half : -1.0</title></rect><text class="ink" x="492.7" y="103.0" font-size="11" font-weight="400" text-anchor="end">-1.0</text><text class="ink" x="180.0" y="93.0" font-size="12" font-weight="400" text-anchor="end">delete a random half</text><rect class="fr1" x="524.0" y="125.0" width="49.3" height="16" rx="4.0"><title>delete 2 of 8 topics : -0.6</title></rect><text class="ink" x="518.0" y="137.0" font-size="11" font-weight="400" text-anchor="end">-0.6</text><rect class="fr3" x="536.9" y="145.0" width="36.4" height="16" rx="4.0"><title>delete 2 of 8 topics : -0.5</title></rect><text class="ink" x="530.9" y="157.0" font-size="11" font-weight="400" text-anchor="end">-0.5</text><text class="ink" x="180.0" y="147.0" font-size="12" font-weight="400" text-anchor="end">delete 2 of 8 topics</text><rect class="fr1" x="497.4" y="179.0" width="75.9" height="16" rx="4.0"><title>replace a random half : -1.0</title></rect><text class="ink" x="491.4" y="191.0" font-size="11" font-weight="400" text-anchor="end">-1.0</text><rect class="fr2" x="527.9" y="199.0" width="45.4" height="16" rx="4.0"><title>replace a random half : -0.6</title></rect><text class="ink" x="521.9" y="211.0" font-size="11" font-weight="400" text-anchor="end">-0.6</text><rect class="fr3" x="531.2" y="219.0" width="42.1" height="16" rx="4.0"><title>replace a random half : -0.5</title></rect><text class="ink" x="525.2" y="231.0" font-size="11" font-weight="400" text-anchor="end">-0.5</text><text class="ink" x="180.0" y="211.0" font-size="12" font-weight="400" text-anchor="end">replace a random half</text><rect class="fr1" x="215.1" y="253.0" width="358.2" height="16" rx="4.0"><title>replace topics 1–4 by 5–8 : -4.7</title></rect><text class="ink" x="209.1" y="265.0" font-size="11" font-weight="400" text-anchor="end">-4.7</text><rect class="fr2" x="482.2" y="273.0" width="91.2" height="16" rx="4.0"><title>replace topics 1–4 by 5–8 : -1.2</title></rect><text class="ink" x="476.2" y="285.0" font-size="11" font-weight="400" text-anchor="end">-1.2</text><rect class="fr3" x="531.6" y="293.0" width="41.8" height="16" rx="4.0"><title>replace topics 1–4 by 5–8 : -0.5</title></rect><text class="ink" x="525.6" y="305.0" font-size="11" font-weight="400" text-anchor="end">-0.5</text><text class="ink" x="180.0" y="285.0" font-size="12" font-weight="400" text-anchor="end">replace topics 1–4 by 5–8</text><line class="ref" x1="573.3" x2="573.3" y1="64" y2="320" stroke-width="1"/><line class="ref" x1="496.7" x2="496.7" y1="64" y2="320" stroke-width="1" stroke-dasharray="4 3"/><text class="ink2" x="500.7" y="58.0" font-size="11" font-weight="400" text-anchor="start">−1 pt</text><rect class="fr1" x="16.0" y="366" width="12" height="12" rx="2"/><text class="ink" x="34.0" y="376.0" font-size="11" font-weight="400" text-anchor="start">after growing (before churn)</text><rect class="fr2" x="225.2" y="366" width="12" height="12" rx="2"/><text class="ink" x="243.2" y="376.0" font-size="11" font-weight="400" text-anchor="start">half replaced</text><rect class="fr3" x="338.4" y="366" width="12" height="12" rx="2"/><text class="ink" x="356.4" y="376.0" font-size="11" font-weight="400" text-anchor="start">after the deletes / all replaced</text><text class="ink2" x="16" y="412.0" font-size="11"><tspan class="ink" font-weight="600">replace</tspan> = delete old documents and insert new ones, 64 at a time, until the old set is gone.</text><text class="ink2" x="16" y="429.0" font-size="11"><tspan class="ink" font-weight="600">merge</tspan> = a posting under target / 4 moves its chunks to its nearest neighbours; codes keep their centre.</text><text class="ink2" x="16" y="446.0" font-size="11"><tspan class="ink" font-weight="600">static</tspan> = k-means fitted on the chunks still present, with the same number of postings.</text></svg>
