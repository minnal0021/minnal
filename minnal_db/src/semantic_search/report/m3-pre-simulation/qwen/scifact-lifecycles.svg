rect class="f2" x="508.8" y="185.0" width="67.9" height="16" rx="4.0"><title>A+C: float seed at 2k chunks : -0.9</title></rect><text class="ink" x="502.8" y="197.0" font-size="11" font-weight="400" text-anchor="end">-0.9</text><text class="ink" x="200.0" y="177.0" font-size="12" font-weight="400" text-anchor="end">A+C: float seed at 2k chunks</text><rect class="f0" x="494.3" y="219.0" width="82.4" height="16" rx="4.0"><title>A+C: float seed at 10k : -1.1</title></rect><text class="ink" x="488.3" y="231.0" font-size="11" font-weight="400" text-anchor="end">-1.1</text><rect class="f1" x="524.2" y="239.0" width="52.5" height="16" rx="4.0"><title>A+C: float seed at 10k : -0.7</title></rect><text class="ink" x="518.2" y="251.0" font-size="11" font-weight="400" text-anchor="end">-0.7</text><rect class="f2" x="317.4" y="259.0" width="259.2" height="16" rx="4.0"><title>A+C: float seed at 10k : -3.5</title></rect><text class="ink" x="311.4" y="271.0" font-size="11" font-weight="400" text-anchor="end">-3.5</text><text class="ink" x="200.0" y="251.0" font-size="12" font-weight="400" text-anchor="end">A+C: float seed at 10k</text><text class="ink2" x="570.7" y="305.0" font-size="11" font-weight="400" text-anchor="end">never seeded: namespace smaller than N (full scan)</text><text class="ink2" x="570.7" y="325.0" font-size="11" font-weight="400" text-anchor="end">never seeded: namespace smaller than N (full scan)</text><text class="ink2" x="570.7" y="345.0" font-size="11" font-weight="400" text-anchor="end">never seeded: namespace smaller than N (full scan)</text><text class="ink" x="200.0" y="325.0" font-size="12" font-weight="400" text-anchor="end">A+C: float seed at 30k</text><rect class="f0" x="314.4" y="367.0" width="262.3" height="16" rx="4.0"><title>B+C: code seed at 2k chunks : -3.6</title></rect><text class="ink" x="308.4" y="379.0" font-size="11" font-weight="400" text-anchor="end">-3.6</text><rect class="f1" x="436.3" y="387.0" width="140.4" height="16" rx="4.0"><title>B+C: code seed at 2k chunks : -1.9</title></rect><text class="ink" x="430.3" y="399.0" font-size="11" font-weight="400" text-anchor="end">-1.9</text><rect class="f2" x="386.3" y="407.0" width="190.4" height="16" rx="4.0"><title>B+C: code seed at 2k chunks : -2.6</title></rect><text class="ink" x="380.3" y="419.0" font-size="11" font-weight="400" text-anchor="end">-2.6</text><text class="ink" x="200.0" y="399.0" font-size="12" font-weight="400" text-anchor="end">B+C: code seed at 2k chunks</text><rect class="f0" x="458.5" y="441.0" width="118.1" height="16" rx="4.0"><title>B+C: code seed at 10k : -1.6</title></rect><text class="ink" x="452.5" y="453.0" font-size="11" font-weight="400" text-anchor="end">-1.6</text><rect class="f1" x="381.7" y="461.0" width="195.0" height="16" rx="4.0"><title>B+C: code seed at 10k : -2.7</title></rect><text class="ink" x="375.7" y="473.0" font-size="11" font-weight="400" text-anchor="end">-2.7</text><rect class="f2" x="435.2" y="481.0" width="141.5" height="16" rx="4.0"><title>B+C: code seed at 10k : -1.9</title></rect><text class="ink" x="429.2" y="493.0" font-size="11" font-weight="400" text-anchor="end">-1.9</text><text class="ink" x="200.0" y="473.0" font-size="12" font-weight="400" text-anchor="end">B+C: code seed at 10k</text><text class="ink2" x="570.7" y="527.0" font-size="11" font-weight="400" text-anchor="end">never seeded: namespace smaller than N (full scan)</text><text class="ink2" x="570.7" y="547.0" font-size="11" font-weight="400" text-anchor="end">never seeded: namespace smaller than N (full scan)</text><text class="ink2" x="570.7" y="567.0" font-size="11" font-weight="400" text-anchor="end">never seeded: namespace smaller than N (full scan)</text><text class="ink" x="200.0" y="547.0" font-size="12" font-weight="400" text-anchor="end">B+C: code seed at 30k</text><line class="ref" x1="576.7" x2="576.7" y1="64" y2="582" stroke-width="1"/><line class="ref" x1="503.3" x2="503.3" y1="64" y2="582" stroke-width="1" stroke-dasharray="4 3"/><text class="ink2" x="507.3" y="58.0" font-size="11" font-weight="400" text-anchor="start">−1 pt</text><rect class="f0" x="16.0" y="628" width="12" height="12" rx="2"/><text class="ink" x="34.0" y="638.0" font-size="11" font-weight="400" text-anchor="start">shuffled</text><rect class="f1" x="97.2" y="628" width="12" height="12" rx="2"/><text class="ink" x="115.2" y="638.0" font-size="11" font-weight="400" text-anchor="start">corpus order</text><rect class="f2" x="204.0" y="628" width="12" height="12" rx="2"/><text class="ink" x="222.0" y="638.0" font-size="11" font-weight="400" text-anchor="start">drifting topics</text><text class="ink2" x="16" y="674.0" font-size="11"><tspan class="ink" font-weight="600">C</tspan> = grow from one posting: split any posting past 2 × target into two (2-means on its codes).</text><text class="ink2" x="16" y="691.0" font-size="11"><tspan class="ink" font-weight="600">A+C</tspan> = keep float embeddings until N chunks, k-means on the floats, drop them, then split as C.</text><text class="ink2" x="16" y="708.0" font-size="11"><tspan class="ink" font-weight="600">B+C</tspan> = stay one flat posting until N chunks, k-means on the 1-bit codes, then split as C.</text><text class="ink2" x="16" y="725.0" font-size="11"><tspan class="ink" font-weight="600">k</tspan> = neighbouring postings re-checked after each split (chunks move to a closer new posting).</text><text class="ink2" x="16" y="742.0" font-size="11"><tspan class="ink" font-weight="600">static k-means</tspan> = fitted once on the whole corpus&#x27;s floats: the best a partition of this size can do.</text><text class="ink2" x="16" y="759.0" font-size="11"><tspan class="ink" font-weight="600">orders</tspan> = documents arrive shuffled, in corpus order, or one topic at a time (8 topics).</text></svg>
