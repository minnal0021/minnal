<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 764" width="720" height="764" role="img" aria-label="scifact: difference in recall from static k-means for seven lifecycles and three insertion orders"><desc>scifact: difference in recall from static k-means for seven lifecycles and three insertion orders</desc><style>text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif}.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.grid{stroke:#e4e3df}.ring{stroke:#fcfcfb}.ref{stroke:#8a8984}.reff{fill:#8a8984}.f0{fill:#2a78d6}.l0{stroke:#2a78d6}.f1{fill:#eb6834}.l1{stroke:#eb6834}.f2{fill:#1baf7a}.l2{stroke:#1baf7a}.f3{fill:#eda100}.l3{stroke:#eda100}.f4{fill:#e87ba4}.l4{stroke:#e87ba4}.f5{fill:#008300}.l5{stroke:#008300}.f6{fill:#4a3aa7}.l6{stroke:#4a3aa7}.f7{fill:#e34948}.l7{stroke:#e34948}.fr0{fill:#86b6ef}.lr0{stroke:#86b6ef}.fr1{fill:#3987e5}.lr1{stroke:#3987e5}.fr2{fill:#1c5cab}.lr2{stroke:#1c5cab}.fr3{fill:#0d366b}.lr3{stroke:#0d366b}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.grid{stroke:#383835}.ring{stroke:#1a1a19}.ref{stroke:#8f8e88}.reff{fill:#8f8e88}.f0{fill:#3987e5}.l0{stroke:#3987e5}.f1{fill:#d95926}.l1{stroke:#d95926}.f2{fill:#199e70}.l2{stroke:#199e70}.f3{fill:#c98500}.l3{stroke:#c98500}.f4{fill:#d55181}.l4{stroke:#d55181}.f5{fill:#008300}.l5{stroke:#008300}.f6{fill:#9085e9}.l6{stroke:#9085e9}.f7{fill:#e66767}.l7{stroke:#e66767}.fr0{fill:#184f95}.lr0{stroke:#184f95}.fr1{fill:#256abf}.lr1{stroke:#256abf}.fr2{fill:#5598e7}.lr2{stroke:#5598e7}.fr3{fill:#9ec5f4}.lr3{stroke:#9ec5f4}}</style><rect class="bg" x="0" y="0" width="720" height="764" rx="6"/><text class="ink" x="16.0" y="26.0" font-size="15" font-weight="600" text-anchor="start">SciFact (qwen, 300 queries, noisier): every lifecycle trails static k-means, by 0.7–4.5 points</text><text class="ink2" x="16.0" y="45.0" font-size="12" font-weight="400" text-anchor="start">Recall@10 at 10% of entries scanned, minus static k-means fitte