t class="fr3" x="110.0" y="145.0" width="519.9" height="16" rx="4.0"><title>2-bit code same nearest centre as the float: 0.963</title></rect><text class="ink" x="635.9" y="157.0" font-size="11" font-weight="400" text-anchor="start">0.963</text><text class="ink" x="100.0" y="147.0" font-size="12" font-weight="400" text-anchor="end">2-bit code</text><rect class="fr1" x="110.0" y="179.0" width="536.4" height="16" rx="4.0"><title>4-bit code direction kept, ⟨ō, o⟩: 0.993</title></rect><text class="ink" x="652.4" y="191.0" font-size="11" font-weight="400" text-anchor="start">0.993</text><rect class="fr3" x="110.0" y="199.0" width="536.2" height="16" rx="4.0"><title>4-bit code same nearest centre as the float: 0.993</title></rect><text class="ink" x="652.2" y="211.0" font-size="11" font-weight="400" text-anchor="start">0.993</text><text class="ink" x="100.0" y="201.0" font-size="12" font-weight="400" text-anchor="end">4-bit code</text><line class="ref" x1="110.0" x2="110.0" y1="64" y2="226" stroke-width="1"/><rect class="fr1" x="16.0" y="272" width="12" height="12" rx="2"/><text class="ink" x="34.0" y="282.0" font-size="11" font-weight="400" text-anchor="start">direction kept: ⟨ō, o⟩, the cosine between code and residual</text><rect class="fr3" x="16.0" y="292" width="12" height="12" rx="2"/><text class="ink" x="34.0" y="302.0" font-size="11" font-weight="400" text-anchor="start">picks the same nearest centre as its float</text><text class="ink2" x="16" y="338.0" font-size="11"><tspan class="ink" font-weight="600">width</tspan> = bits per dimension of a chunk code: 1 is today&#x27;s; 2 and 4 hold more of the vector.</text></svg>
