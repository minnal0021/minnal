target 128: 0.78519k → 0.92</title></circle><circle class="f0 ring" cx="364.8" cy="84.0" r="4" stroke-width="2"><title>static k-means, target 128: 1.48619k → 0.97</title></circle><text class="ink" x="578.0" y="91.0" font-size="11" font-weight="400" text-anchor="start">target 128 (K 43) 0.96</text><text class="ink" x="578.0" y="105.0" font-size="11" font-weight="400" text-anchor="start">target 256 (K 20) 0.94</text><text class="ink" x="578.0" y="120.0" font-size="11" font-weight="400" text-anchor="start">target 512 (K 9) 0.91</text><text class="ink" x="578.0" y="147.5" font-size="11" font-weight="400" text-anchor="start">target 1024 (K 4) 0.87</text><text class="ink" x="578.0" y="163.8" font-size="11" font-weight="400" text-anchor="start">bundled file (K 256) 0.84</text><line class="lr0" x1="16.0" x2="38.0" y1="352.0" y2="352.0" stroke-width="2"/><text class="ink" x="44.0" y="356.0" font-size="11" font-weight="400" text-anchor="start">target 1024 (K 4)</text><line class="lr1" x1="245.3" x2="267.3" y1="352.0" y2="352.0" stroke-width="2"/><text class="ink" x="273.3" y="356.0" font-size="11" font-weight="400" text-anchor="start">target 512 (K 9)</text><line class="lr2" x1="474.7" x2="496.7" y1="352.0" y2="352.0" stroke-width="2"/><text class="ink" x="502.7" y="356.0" font-size="11" font-weight="400" text-anchor="start">target 256 (K 20)</text><line class="lr3" x1="16.0" x2="38.0" y1="372.0" y2="372.0" stroke-width="2"/><text class="ink" x="44.0" y="376.0" font-size="11" font-weight="400" text-anchor="start">target 128 (K 43)</text><line class="l1" x1="245.3" x2="267.3" y1="372.0" y2="372.0" stroke-width="2"/><text class="ink" x="273.3" y="376.0" font-size="11" font-weight="400" text-anchor="start">bundled file (K 256)</text><line class="l0" x1="474.7" x2="496.7" y1="372.0" y2="372.0" stroke-width="2" stroke-dasharray="6 4"/><text class="ink" x="502.7" y="376.0" font-size="11" font-weight="400" text-anchor="start">static k-means, target 128</text><text class="ink2" x="16" y="418.0" font-size="11"><tspan class="ink" font-weight="600">target</tspan> = posting size in entries: a posting splits past 2 × target, so K grows with the namespace.</text><text class="ink2" x="16" y="435.0" font-size="11"><tspan class="ink" font-weight="600">ANN recall@10</tspan> = share of the exact (float, unpartitioned) top 10 the index returns.</text><text class="ink2" x="16" y="452.0" font-size="11"><tspan class="ink" font-weight="600">entry</tspan> = one (posting, document) key holding that document&#x27;s chunk codes in the posting, not its text.</text><text class="ink2" x="16" y="469.0" font-size="11"><tspan class="ink" font-weight="600">static k-means</tspan> = fitted once on the whole corpus&#x27;s floats: the best a partition of this size can do.</text><text class="ink2" x="16" y="486.0" font-size="11"><tspan class="ink" font-weight="600">bundled file</tspan> = today&#x27;s 256 general-purpose qwen centroids (fitted on ELI5).</text></svg>
