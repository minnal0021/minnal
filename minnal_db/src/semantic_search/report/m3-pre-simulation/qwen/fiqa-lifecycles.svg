"ink2" x="16" y="725.0" font-size="11"><tspan class="ink" font-weight="600">k</tspan> = neighbouring postings re-checked after each split (chunks move to a closer new posting).</text><text class="ink2" x="16" y="742.0" font-size="11"><tspan class="ink" font-weight="600">static k-means</tspan> = fitted once on the whole corpus&#x27;s floats: the best a partition of this size can do.</text><text class="ink2" x="16" y="759.0" font-size="11"><tspan class="ink" font-weight="600">orders</tspan> = documents arrive shuffled, in corpus order, or one topic at a time (8 topics).</text></svg>
