ine class="grid" x1="266.7" x2="266.7" y1="64" y2="320" stroke-width="1"/><text class="ink2" x="266.7" y="336.0" font-size="11" font-weight="400" text-anchor="middle">-4</text><line class="grid" x1="420.0" x2="420.0" y1="64" y2="320" stroke-width="1"/><text class="ink2" x="420.0" y="336.0" font-size="11" font-weight="400" text-anchor="middle">-2</text><line class="grid" x1="573.3" x2="573.3" y1="64" y2="320" stroke-width="1"/><text class="ink2" x="573.3" y="336.0" font-size="11" font-weight="400" text-anchor="middle">0</text><text class="ink2" x="420.0" y="356.0" font-size="12" font-weight="400" text-anchor="middle">difference from static k-means (recall points; 0 = as good)</text><rect class="fr1" x="530.8" y="71.0" width="42.6" height="16" rx="4.0"><title>delete a random half : -0.6</title></rect><text class="ink" x="524.8" y="83.0" font-size="11" font-weight="400" text-anchor="end">-0.6</text><rect class="fr3" x="465.1" y="91.0" width="108.3" height="16" rx="4.0"><title>delete a random half : -1.4</title></rect><text class="ink" x="459.1" y="103.0" font-size="11" font-weight="400" text-anchor="end">-1.4</text><text class="ink" x="180.0" y="93.0" font-size="12" font-weight="400" text-anchor="end">delete a random half</text><rect class="fr1" x="530.8" y="125.0" width="42.6" height="16" rx="4.0"><title>delete 2 of 8 topics : -0.6</title></rect><text class="ink" x="524.8" y="137.0" font-size="11" font-weight="400" text-anchor="end">-0.6</text><rect class="fr3" x="573.3" y="145.0" width="11.0" height="16" rx="4.0"><title>delete 2 of 8 topics : +0.1</title></rect><text class="ink" x="590.3" y="157.0" font-size="11" font-weight="400" text-anchor="start">+0.1</text><text class="ink" x="180.0" y="147.0" font-size="12" font-weight="400" text-anchor="end">delete 2 of 8 topics</text><rect class="fr1" x="355.1" y="179.0" width="218.2" height="16" rx="4.0"><title>replace a random half : -2.8</title></rect><text class="ink" x="349.1" y="191.0" font-size="11" font-weight="400" text-anchor="end">-2.8</text><rect class="fr2" x="336.4" y="199.0" width="236.9" height="16" rx="4.0"><title>replace a random half : -3.1</title></rect><text class="ink" x="330.4" y="211.0" font-size="11" font-weight="400" text-anchor="end">-3.1</text><rect class="fr3" x="410.5" y="219.0" width="162.8" height="16" rx="4.0"><title>replace a random half : -2.1</title></rect><text class="ink" x="404.5" y="231.0" font-size="11" font-weight="400" text-anchor="end">-2.1</text><text class="ink" x="180.0" y="211.0" font-size="12" font-weight="400" text-anchor="end">replace a random half</text><rect class="fr1" x="441.9" y="253.0" width="131.5" height="16" rx="4.0"><title>replace topics 1–4 by 5–8 : -1.7</title></rect><text class="ink" x="435.9" y="265.0" font-size="11" font-weight="400" text-anchor="end">-1.7</text><rect class="fr2" x="573.3" y="273.0" width="1.3" height="16" rx="0.7"><title>replace topics 1–4 by 5–8 : +0.0</title></rect><text class="ink" x="580.6" y="285.0" font-size="11" font-weight="400" text-anchor="start">+0.0</text><rect class="fr3" x="573.3" y="293.0" width="8.3" height="16" rx="4.0"><title>replace topics 1–4 by 5–8 : +0.1</title></rect><text class="ink" x="587.6" y="305.0" font-size="11" font-weight="400" text-anchor="start">+0.1</text><text class="ink" x="180.0" y="285.0" font-size="12" font-weight="400" text-anchor="end">replace topics 1–4 by 5–8</text><line class="ref" x1="573.3" x2="573.3" y1="64" y2="320" stroke-width="1"/><line class="ref" x1="496.7" x2="496.7" y1="64" y2="320" stroke-width="1" stroke-dasharray="4 3"/><text class="ink2" x="500.7" y="58.0" font-size="11" font-weight="400" text-anchor="start">−1 pt</text><rect class="fr1" x="16.0" y="366" width="12" height="12" rx="2"/><text class="ink" x="34.0" y="376.0" font-size="11" font-weight="400" text-anchor="start">after growing (before churn)</text><rect class="fr2" x="225.2" y="366" width="12" height="12" rx="2"/><text class="ink" x="243.2" y="376.0" font-size="11" font-weight="400" text-anchor="start">half replaced</text><rect class="fr3" x="338.4" y="366" width="12" height="12" rx="2"/><text class="ink" x="356.4" y="376.0" font-size="11" font-weight="400" text-anchor="start">after the deletes / all replaced</text><text class="ink2" x="16" y="412.0" font-size="11"><tspan class="ink" font-weight="600">replace</tspan> = delete old documents and insert new ones, 64 at a time, until the old set is gone.</text><text class="ink2" x="16" y="429.0" font-size="11"><tspan class="ink" font-weight="600">merge</tspan> = a posting under target / 4 moves its chunks to its nearest neighbours; codes keep their centre.</text><text class="ink2" x="16" y="446.0" font-size="11"><tspan class="ink" font-weight="600">static</tspan> = k-means fitted on the chunks still present, with the same number of postings.</text></svg>
