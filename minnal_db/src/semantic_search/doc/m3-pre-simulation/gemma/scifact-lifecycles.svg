 class="ink2" x="507.3" y="58.0" font-size="11" font-weight="400" text-anchor="start">−1 pt</text><rect class="f0" x="16.0" y="628" width="12" height="12" rx="2"/><text class="ink" x="34.0" y="638.0" font-size="11" font-weight="400" text-anchor="start">shuffled</text><rect class="f1" x="97.2" y="628" width="12" height="12" rx="2"/><text class="ink" x="115.2" y="638.0" font-size="11" font-weight="400" text-anchor="start">corpus order</text><rect class="f2" x="204.0" y="628" width="12" height="12" rx="2"/><text class="ink" x="222.0" y="638.0" font-size="11" font-weight="400" text-anchor="start">drifting topics</text><text class="ink2" x="16" y="674.0" font-size="11"><tspan class="ink" font-weight="600">C</tspan> = grow from one posting: split any posting past 2 × target into two (2-means on its codes).</text><text class="ink2" x="16" y="691.0" font-size="11"><tspan class="ink" font-weight="600">A+C</tspan> = keep float embeddings until N chunks, k-means on the floats, drop them, then split as C.</text><text class="ink2" x="16" y="708.0" font-size="11"><tspan class="ink" font-weight="600">B+C</tspan> = stay one flat posting until N chunks, k-means on the 1-bit codes, then split as C.</text><text class="ink2" x="16" y="725.0" font-size="11"><tspan class="ink" font-weight="600">k</tspan> = neighbouring postings re-checked after each split (chunks move to a closer new posting).</text><text class="ink2" x="16" y="742.0" font-size="11"><tspan class="ink" font-weight="600">static k-means</tspan> = fitted once on the whole corpus&#x27;s floats: the best a partition of this size can do.</text><text class="ink2" x="16" y="759.0" font-size="11"><tspan class="ink" font-weight="600">orders</tspan> = documents arrive shuffled, in corpus order, or one topic at a time (8 topics).</text></svg>
